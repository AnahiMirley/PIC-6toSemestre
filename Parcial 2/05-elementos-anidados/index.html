<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La heladería</title>
        <link rel="icon" href="./favicon.ico">
    </head>
    <body>
        <div id="root"></div>
        <script type="module">
            import React from "https://esm.sh/react@19.2.0?dev";
            import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

            // Primer sabor (de dentro hacia afuera)
            const itemName = React.createElement("h2", null, "Mora silvestre");
            const itemDescription = React.createElement(
                "p",
                { className: "menu-item-description" },
                "Mora de Ambato con un toque de limón."
            );
            const menuItem = React.createElement(
                "article",
                { className: "menu-item" },
                itemName,
                itemDescription
            );

            // Actividad 5: segundo sabor con createElement
            const secondItemName = React.createElement("h2", null, "Pistacho");
            const secondItemDescription = React.createElement(
                "p",
                { className: "menu-item-description" },
                "Sabor suave y pequeños trozos de avellana."
            );
            const secondMenuItem = React.createElement(
                "article",
                { className: "menu-item" },
                secondItemName,
                secondItemDescription
            );

            const heading = React.createElement("h1", null, "La Heladería");
            const menu = React.createElement("main", null, heading, menuItem, secondMenuItem);

            console.log(menuItem.props);
            createRoot(document.getElementById("root")).render(menu);
        </script>
    </body>
</html>
