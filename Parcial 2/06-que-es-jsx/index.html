<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La heladería</title>
        <link rel="icon" href="./favicon.ico">
    </head>
    <body>
        <div id="root"></div>
        <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
        <script type="text/babel" data-type="module">
            import React from "https://esm.sh/react@19.2.0?dev";
            import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

            // Actividad 6: itemName pasa a JSX; el resto sigue con createElement
            const itemName = <h2>Mora silvestre</h2>;
            console.log(itemName);

            const itemDescription = React.createElement(
                "p",
                { className: "menu-item-description" },
                "Mora de Ambato con un toque de limón."
            );
            const menuItem = React.createElement(
                "article",
                { className: "menu-item" },
                itemName,
                itemDescription
            );

            const heading = <h1>La Heladería</h1>;
            console.log(heading);

            const menu = React.createElement("main", null, heading, menuItem);
            createRoot(document.getElementById("root")).render(menu);
        </script>
    </body>
</html>
